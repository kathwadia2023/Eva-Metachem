<!doctype html>
<!--
  GitHub Pages has no server-side routing, so a direct visit or refresh on
  a deep link like /products/copper-sulphate-pentahydrate/ returns 404.
  This is the standard SPA workaround: GitHub serves this file for any
  unknown path, and it redirects back to index.html while preserving the
  original path in a query string that main.tsx / App.tsx restores via
  history.replaceState before React Router takes over.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EVA METACHEM</title>
    <script>
      var pathSegmentsToKeep = 0; // set to 1 if deploying as a project page (github.io/<repo>/)
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
